name: Link Checker

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "lychee.toml"
      - ".github/workflows/link-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "lychee.toml"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Weekly on Mondays at 03:00 UTC

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore lychee cache
        id: restore-lychee
        uses: actions/cache/restore@v6
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-v1
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Run Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --config lychee.toml .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save lychee cache
        if: always() && steps.restore-lychee.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-v1
